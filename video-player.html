<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PornTube Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        video { width: 100%; max-width: 950px; margin: 20px auto; display: block; background: #000; border-radius: 12px; }
        .container { max-width: 950px; margin: 0 auto; padding: 0 20px; }
        .comments { margin-top: 30px; }
        .comment { background: #1a1a1a; padding: 14px; margin: 10px 0; border-radius: 8px; }
        textarea { width: 100%; height: 90px; background: #333; color: white; border: none; border-radius: 8px; padding: 12px; margin-top: 10px; }
        button { width: 100%; padding: 14px; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <div class="container">
        <video id="player" controls autoplay></video>
        <h2 id="video-title"></h2>
        <p id="video-tags" style="color:#ff4081; margin-bottom:20px;"></p>

        <div class="comments">
            <h3>Комментарии</h3>
            <div id="comments-list"></div>
            <textarea id="new-comment" placeholder="Напиши комментарий..."></textarea>
            <button onclick="postComment()">Отправить комментарий</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));

        let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];
        let item = uploads.find(i => i.id === id);

        if (!item) {
            alert("Контент не найден");
            window.location.href = "index.html";
        } else {
            document.getElementById('player').src = item.url;
            document.getElementById('video-title').textContent = item.title;
            document.getElementById('video-tags').textContent = "Теги: " + (item.tags ? item.tags.join(" • ") : "—");

            function renderComments() {
                const list = document.getElementById('comments-list');
                list.innerHTML = '';
                (item.comments || []).forEach(text => {
                    const div = document.createElement('div');
                    div.className = 'comment';
                    div.innerHTML = `<strong>Аноним:</strong> ${text}`;
                    list.appendChild(div);
                });
            }

            window.postComment = function() {
                const text = document.getElementById('new-comment').value.trim();
                if (!text) return;
                if (!item.comments) item.comments = [];
                item.comments.push(text);
                localStorage.setItem('pornUploads', JSON.stringify(uploads));
                renderComments();
                document.getElementById('new-comment').value = '';
            };

            renderComments();
        }
    </script>
</body>
</html>
