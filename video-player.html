<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PornTube Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        video { width: 100%; max-width: 900px; margin: 20px auto; display: block; background: black; }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <main style="text-align:center; padding:20px;">
        <video id="player" controls autoplay></video>
        <h2 id="video-title"></h2>
        <p id="video-tags"></p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        if (!id) {
            alert('Видео не найдено');
            window.location.href = 'index.html';
        }

        const uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];
        const video = uploads.find(v => v.id == id);

        if (video) {
            document.getElementById('player').src = video.url;
            document.getElementById('video-title').textContent = video.title;
            document.getElementById('video-tags').textContent = 'Теги: ' + (video.tags ? video.tags.join(', ') : 'нет');
        } else {
            alert('Видео не найдено');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
