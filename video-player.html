<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PornTube Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        video { width: 100%; max-width: 900px; margin: 20px auto; display: block; background: #000; }
        .comments { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .comment { background: #1a1a1a; padding: 12px; margin: 10px 0; border-radius: 8px; }
        textarea { width: 100%; height: 80px; background: #333; color: white; border: none; border-radius: 8px; padding: 10px; }
        button { margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <main style="text-align:center;">
        <video id="player" controls autoplay></video>
        <h2 id="video-title" style="margin:15px 0;"></h2>
        <p id="video-tags" style="color:#ff4081;"></p>

        <div class="comments">
            <h3>Комментарии</h3>
            <div id="comments-list"></div>
            <textarea id="comment-text" placeholder="Напиши комментарий..."></textarea>
            <button onclick="addComment()">Отправить комментарий</button>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));
        let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];
        let currentItem = uploads.find(item => item.id === id);

        if (!currentItem) {
            alert("Видео не найдено");
            window.location.href = "index.html";
        } else {
            document.getElementById('player').src = currentItem.url;
            document.getElementById('video-title').textContent = currentItem.title;
            document.getElementById('video-tags').textContent = "Теги: " + (currentItem.tags ? currentItem.tags.join(" • ") : "нет");

            function renderComments() {
                const list = document.getElementById('comments-list');
                list.innerHTML = '';
                (currentItem.comments || []).forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'comment';
                    div.innerHTML = `<strong>Аноним:</strong> ${c}`;
                    list.appendChild(div);
                });
            }

            window.addComment = function() {
                const text = document.getElementById('comment-text').value.trim();
                if (!text) return;
                if (!currentItem.comments) currentItem.comments = [];
                currentItem.comments.push(text);
                localStorage.setItem('pornUploads', JSON.stringify(uploads));
                renderComments();
                document.getElementById('comment-text').value = '';
            };

            renderComments();
        }
    </script>
</body>
</html>
