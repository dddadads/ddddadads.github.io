<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PornTube Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        video { 
            width: 100%; 
            max-width: 950px; 
            margin: 20px auto; 
            display: block; 
            background: #000; 
            border-radius: 12px; 
        }
        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            padding: 0 20px; 
        }
        .comments { margin-top: 30px; }
        .comment { 
            background: #1a1a1a; 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 8px; 
        }
        .comment strong {
            color: #ff4081;
        }
        textarea { 
            width: 100%; 
            height: 90px; 
            background: #333; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            padding: 12px; 
            margin-top: 10px; 
        }
        .action-btn {
            padding: 12px 20px;
            margin: 8px 5px;
            font-size: 16px;
        }
        .admin-actions {
            margin: 15px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <div class="container">
        <video id="player" controls autoplay></video>
        
        <h2 id="video-title"></h2>
        <p id="video-tags" style="color:#ff4081; margin-bottom:15px;"></p>

        <!-- Кнопки действий -->
        <div style="margin:15px 0;">
            <button onclick="likeThisPost()" class="action-btn">❤️ Лайкнуть (<span id="like-count">0</span>)</button>
        </div>

        <!-- Админ действия -->
        <div id="admin-actions" class="admin-actions hidden">
            <button onclick="deleteThisPost()" class="action-btn danger">🗑 Удалить этот пост (Админ)</button>
        </div>

        <div class="comments">
            <h3>Комментарии</h3>
            <div id="comments-list"></div>
            
            <textarea id="new-comment" placeholder="Напиши комментарий..."></textarea>
            <button onclick="postComment()" class="action-btn">Отправить комментарий</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));
        
        let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];
        let currentUser = localStorage.getItem('currentUser') || null;
        let item = uploads.find(i => i.id === id);

        if (!item) {
            alert("Контент не найден");
            window.location.href = "index.html";
        } else {
            // Загружаем видео/фото
            document.getElementById('player').src = item.url;
            document.getElementById('video-title').textContent = item.title;
            document.getElementById('video-tags').textContent = "Теги: " + (item.tags ? item.tags.join(" • ") : "—");
            document.getElementById('like-count').textContent = item.likes || 0;

            // Показываем админ кнопки
            if (currentUser === "Kostye119") {
                document.getElementById('admin-actions').classList.remove('hidden');
            }

            // Рендер комментариев
            function renderComments() {
                const list = document.getElementById('comments-list');
                list.innerHTML = '';
                (item.comments || []).forEach(comment => {
                    const div = document.createElement('div');
                    div.className = 'comment';
                    div.innerHTML = `<strong>${comment.username || 'Аноним'}:</strong> ${comment.text}`;
                    list.appendChild(div);
                });
            }

            // Отправка комментария с именем пользователя
            window.postComment = function() {
                const text = document.getElementById('new-comment').value.trim();
                if (!text) return;

                if (!item.comments) item.comments = [];
                
                item.comments.push({
                    username: currentUser || "Аноним",
                    text: text,
                    date: new Date().toISOString()
                });

                localStorage.setItem('pornUploads', JSON.stringify(uploads));
                renderComments();
                document.getElementById('new-comment').value = '';
            };

            // Лайк
            window.likeThisPost = function() {
                item.likes = (item.likes || 0) + 1;
                document.getElementById('like-count').textContent = item.likes;
                localStorage.setItem('pornUploads', JSON.stringify(uploads));
            };

            // Удаление поста (только для админа)
            window.deleteThisPost = function() {
                if (confirm("Удалить этот пост навсегда?")) {
                    const index = uploads.findIndex(i => i.id === id);
                    if (index !== -1) {
                        uploads.splice(index, 1);
                        localStorage.setItem('pornUploads', JSON.stringify(uploads));
                        alert("Пост удалён!");
                        window.location.href = "index.html";
                    }
                }
            };

            renderComments();
        }
    </script>
</body>
</html>
