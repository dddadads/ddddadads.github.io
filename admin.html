<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мега Админ — PornTube</title>
    <link rel="stylesheet" href="style.css">
    <style>
        main { max-width: 1100px; margin: 30px auto; padding: 20px; }
        .admin-card {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .stat { font-size: 28px; color: #ff4081; font-weight: bold; }
        .post-item {
            background: #222;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post-item img, .post-item video {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }
        button {
            padding: 10px 16px;
            margin: 5px;
            font-size: 15px;
        }
        .danger { background: #ff1a5c !important; }
        .delete-btn { background: #c62828; }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <main>
        <h1>👑 Мега Админ Панель — Kostye119</h1>
        <p style="color:#888;">Добро пожаловать, <strong id="admin-name"></strong></p>

        <div class="admin-card">
            <h2>Статистика</h2>
            <p>Всего загрузок: <span id="total-uploads" class="stat">0</span></p>
            <p>Фото: <span id="total-photos" class="stat">0</span></p>
            <p>Видео: <span id="total-videos" class="stat">0</span></p>
        </div>

        <div class="admin-card">
            <h2>Все посты (можно удалять)</h2>
            <div id="all-posts-list"></div>
        </div>

        <div class="admin-card">
            <h2>Глобальное управление</h2>
            <button onclick="clearAllData()" class="danger">Очистить все данные сайта</button>
            <button onclick="deleteAllUploads()" class="danger">Удалить все загрузки</button>
            <button onclick="exportData()">Экспортировать данные (JSON)</button>
        </div>
    </main>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser !== "Kostye119") {
            alert("Доступ запрещён! Только для администратора Kostye119.");
            window.location.href = "index.html";
        }

        document.getElementById('admin-name').textContent = currentUser;

        let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];

        // Статистика
        document.getElementById('total-uploads').textContent = uploads.length;
        document.getElementById('total-photos').textContent = uploads.filter(i => i.type === 'image').length;
        document.getElementById('total-videos').textContent = uploads.filter(i => i.type === 'video').length;

        // Отображение всех постов с кнопкой удаления
        function renderAllPosts() {
            const container = document.getElementById('all-posts-list');
            container.innerHTML = '';

            if (uploads.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; padding:30px;">Пока нет постов</p>';
                return;
            }

            uploads.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'post-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px;">
                        ${item.type === 'image' ? 
                            `<img src="${item.url}" alt="${item.title}">` : 
                            `<video src="${item.url}" muted></video>`
                        }
                        <div>
                            <strong>${item.title}</strong><br>
                            <small style="color:#888;">${item.tags ? item.tags.join(', ') : 'без тегов'}</small>
                        </div>
                    </div>
                    <div>
                        <button onclick="deletePost(${index})" class="delete-btn">Удалить пост</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Удаление отдельного поста
        function deletePost(index) {
            if (confirm("Удалить этот пост навсегда?")) {
                uploads.splice(index, 1);
                localStorage.setItem('pornUploads', JSON.stringify(uploads));
                alert("Пост удалён!");
                location.reload();
            }
        }

        function clearAllData() {
            if (confirm("ОЧИСТИТЬ ВСЁ? Это удалит все данные сайта навсегда!")) {
                localStorage.clear();
                alert("Все данные очищены.");
                window.location.href = "index.html";
            }
        }

        function deleteAllUploads() {
            if (confirm("Удалить ВСЕ загрузки пользователей?")) {
                localStorage.setItem('pornUploads', JSON.stringify([]));
                alert("Все загрузки удалены.");
                location.reload();
            }
        }

        function exportData() {
            const dataStr = JSON.stringify(uploads, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'porntube_backup.json');
            linkElement.click();
        }

        // Запуск
        window.onload = function() {
            renderAllPosts();
        };
    </script>
</body>
</html>
