<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PornTube - 18+ и Rule34</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .modal-content {
            width: 460px;
            padding: 35px 30px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #333;
        }
        .tab {
            padding: 14px 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 17px;
            transition: all 0.3s;
        }
        .tab.active {
            color: #ff4081;
            border-bottom: 4px solid #ff4081;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: #2a2a2a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
        }
        .close-btn {
            background: #555 !important;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <input type="text" id="search" placeholder="Поиск по названию или тегам...">

        <div id="user-panel">
            <span id="username-display">Гость</span>
            <button onclick="showAuthModal()">Войти / Регистрация</button>
            <button onclick="logout()" id="logout-btn" class="hidden">Выйти</button>
        </div>
    </header>

    <nav class="nav">
        <a onclick="showSection('home')">Главная</a>
        <a onclick="showSection('videos')">Видео</a>
        <a onclick="showSection('photos')">Фото</a>
        <a onclick="showSection('rule34')">Rule34</a>
        <a href="gallery.html">Галерея</a>
        <a onclick="showSection('channels')">Каналы</a>
        <a href="user.html">Мой профиль</a>
        <a href="admin.html" id="admin-link" style="display: none;">👑 Админ</a>
        <a onclick="showSection('uploads')">Мои загрузки</a>
    </nav>

    <main>
        <section id="home-section" class="section">
            <h1>🔥 Trending 18+</h1>
            <div id="trending-grid" class="grid"></div>
        </section>

        <section id="videos-section" class="section hidden">
            <h1>Видео</h1>
            <div id="videos-grid" class="grid"></div>
        </section>

        <section id="photos-section" class="section hidden">
            <h1>Фото</h1>
            <div id="photos-grid" class="grid"></div>
        </section>

        <section id="rule34-section" class="section hidden">
            <h1>Rule34 / Hentai</h1>
            <div id="rule34-grid" class="grid"></div>
        </section>

        <section id="channels-section" class="section hidden">
            <h1>Каналы</h1>
            <div id="channels-grid" class="grid"></div>
        </section>

        <section id="uploads-section" class="section hidden">
            <h1>Мои загрузки</h1>
            <div id="uploads-grid" class="grid"></div>
        </section>
    </main>

    <!-- Модальное окно авторизации -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <div class="tabs">
                <span onclick="switchTab(1)" id="tab-login" class="tab active">Вход</span>
                <span onclick="switchTab(2)" id="tab-register" class="tab">Регистрация</span>
            </div>

            <!-- Форма Входа -->
            <div id="login-form">
                <div class="form-group">
                    <input type="text" id="login-username" placeholder="Имя пользователя" required>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" placeholder="Пароль" required>
                </div>
                <button onclick="loginUser()">Войти</button>
            </div>

            <!-- Форма Регистрации -->
            <div id="register-form" class="hidden">
                <div class="form-group">
                    <input type="text" id="reg-username" placeholder="Имя пользователя" required>
                </div>
                <div class="form-group">
                    <input type="password" id="reg-password" placeholder="Пароль" required>
                </div>
                <div class="form-group">
                    <input type="password" id="reg-password2" placeholder="Повторите пароль" required>
                </div>
                <button onclick="registerUser()">Зарегистрироваться</button>
            </div>

            <button onclick="closeAuthModal()" class="close-btn">Закрыть</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
