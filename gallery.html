<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея — PornTube</title>
    <link rel="stylesheet" href="style.css">
    <style>
        main { 
            padding: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .gallery-header h1 {
            color: #ff4081;
            font-size: 28px;
        }
        #gallery-search {
            padding: 14px 20px;
            width: 380px;
            background: #2a2a2a;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 16px;
        }
        #gallery-search:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 64, 129, 0.4);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(255, 64, 129, 0.25);
        }
        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .card:hover img {
            transform: scale(1.08);
        }
        .card .info {
            padding: 16px;
        }
        .card h3 {
            font-size: 16.5px;
            height: 48px;
            overflow: hidden;
            line-height: 1.35;
        }
        .tags {
            color: #ff4081;
            font-size: 13.5px;
            margin: 8px 0;
        }
        .likes {
            color: #ff4081;
            font-size: 15px;
        }
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <main>
        <div class="gallery-header">
            <h1>📸 Галерея (Фото + Rule34)</h1>
            <input type="text" id="gallery-search" placeholder="Поиск по названию или тегам...">
        </div>

        <div id="gallery-grid" class="grid"></div>
    </main>

    <script>
        let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];
        let currentUser = localStorage.getItem('currentUser') || null;

        function isImage(item) {
            if (!item || !item.url) return false;
            if (item.type === 'image') return true;
            if (item.url.startsWith('data:image')) return true;
            if (/\.(jpg|jpeg|png|gif|webp)$/i.test(item.url)) return true;
            return false;
        }

        function renderGallery(filteredItems) {
            const container = document.getElementById('gallery-grid');
            container.innerHTML = '';

            const imagesOnly = filteredItems.filter(item => isImage(item));

            if (imagesOnly.length === 0) {
                container.innerHTML = `<p class="empty">😶 Пока нет изображений в галерее</p>`;
                return;
            }

            imagesOnly.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <a href="video-player.html?id=${item.id}">
                        <img src="${item.url}" alt="${item.title}">
                        <div class="info">
                            <h3>${item.title}</h3>
                            <div class="tags">${item.tags ? item.tags.join(' • ') : ''}</div>
                            <div class="likes">❤️ ${item.likes || 0}</div>
                            ${item.uploadedBy ? `<small style="color:#888;">Загрузил: ${item.uploadedBy}</small>` : ''}
                        </div>
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // Поиск в галерее
        document.getElementById('gallery-search').addEventListener('input', function() {
            const term = this.value.toLowerCase().trim();
            let filtered = uploads;

            if (term) {
                filtered = uploads.filter(item => 
                    (item.title && item.title.toLowerCase().includes(term)) ||
                    (item.tags && item.tags.some(tag => tag.toLowerCase().includes(term)))
                );
            }

            renderGallery(filtered);
        });

        // Загрузка при открытии страницы
        window.onload = function() {
            renderGallery(uploads);
        };
    </script>
</body>
</html>
