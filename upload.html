<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка — PornTube</title>
    <link rel="stylesheet" href="style.css">
    <style>
        main {
            max-width: 720px;
            margin: 40px auto;
            padding: 40px 30px;
            background: #1a1a1a;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ff4081;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 600;
        }
        input[type="text"], 
        input[type="file"] {
            width: 100%;
            padding: 14px 16px;
            background: #2a2a2a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }
        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #ff1a5c;
            transform: translateY(-2px);
        }
        .info-text {
            text-align: center;
            color: #888;
            margin-top: 25px;
            font-size: 14.5px;
        }
        .drag-area {
            border: 2px dashed #ff4081;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin: 15px 0;
            transition: all 0.3s;
            cursor: pointer;
        }
        .drag-area:hover {
            background: #2a2a2a;
            border-color: #ff1a5c;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <main>
        <h1>📤 Загрузить контент (18+)</h1>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="title">Название</label>
                <input type="text" id="title" placeholder="Введите название видео или фото" required>
            </div>

            <div class="form-group">
                <label>Файл (фото или видео)</label>
                <div id="drag-area" class="drag-area">
                    <p>Нажмите или перетащите файл сюда</p>
                    <input type="file" id="fileInput" accept="image/*,video/*" required style="display:none;">
                </div>
            </div>

            <div class="form-group">
                <label for="tags">Теги (через запятую)</label>
                <input type="text" id="tags" placeholder="hentai, rule34, blonde, furry, anime...">
            </div>

            <button type="submit">Загрузить на PornTube</button>
        </form>

        <p class="info-text">
            ⚠️ Загруженные файлы сохраняются только в твоём браузере<br>
            Другие пользователи их не увидят
        </p>
    </main>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const dragArea = document.getElementById('drag-area');

        // Drag & Drop
        dragArea.addEventListener('click', () => fileInput.click());

        dragArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragArea.style.background = '#2a2a2a';
        });

        dragArea.addEventListener('dragleave', () => {
            dragArea.style.background = '';
        });

        dragArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dragArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file) {
                fileInput.files = e.dataTransfer.files;
            }
        });

        // Основная загрузка
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const file = fileInput.files[0];
            const title = document.getElementById('title').value.trim();
            const tagsStr = document.getElementById('tags').value;

            if (!file || !title) {
                alert("Пожалуйста, введите название и выберите файл!");
                return;
            }

            const tags = tagsStr 
                ? tagsStr.split(',').map(t => t.trim()).filter(t => t.length > 0) 
                : [];

            const reader = new FileReader();
            reader.onload = function(event) {
                let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];

                const currentUser = localStorage.getItem('currentUser') || "Аноним";

                const newItem = {
                    id: Date.now(),
                    title: title,
                    url: event.target.result,
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    tags: tags,
                    likes: 0,
                    comments: [],
                    uploadedBy: currentUser,        // ← важно для профиля
                    date: new Date().toISOString()
                };

                uploads.push(newItem);
                localStorage.setItem('pornUploads', JSON.stringify(uploads));

                alert("✅ Контент успешно загружен!");
                window.location.href = "index.html";
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
