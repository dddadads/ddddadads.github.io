<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка — PornTube</title>
    <link rel="stylesheet" href="style.css">
    <style>
        main { 
            max-width: 700px; 
            margin: 40px auto; 
            padding: 30px; 
            background: #1a1a1a; 
            border-radius: 12px; 
        }
        input, button { 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            border-radius: 8px; 
            font-size: 16px; 
        }
        input[type="text"], input[type="file"] { 
            background: #333; 
            color: white; 
            border: none; 
        }
        button { 
            background: #ff4081; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 20px; 
        }
        button:hover {
            background: #ff1a5c;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <main>
        <h1>Загрузить контент (18+)</h1>
        
        <form id="uploadForm">
            <input type="text" id="title" placeholder="Название видео или фото" required>
            <input type="file" id="fileInput" accept="image/*,video/*" required>
            <input type="text" id="tags" placeholder="Теги через запятую (hentai, rule34, blonde, furry...)">
            <button type="submit">Загрузить на PornTube</button>
        </form>

        <p style="text-align:center; color:#888; margin-top:25px; font-size:14px;">
            ⚠️ Загруженные файлы видны только тебе в этом браузере
        </p>
    </main>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const file = document.getElementById('fileInput').files[0];
            const title = document.getElementById('title').value.trim();
            const tagsStr = document.getElementById('tags').value;

            if (!file || !title) {
                alert("Пожалуйста, введи название и выбери файл!");
                return;
            }

            const tags = tagsStr 
                ? tagsStr.split(',').map(t => t.trim()).filter(t => t.length > 0) 
                : [];

            const reader = new FileReader();
            reader.onload = function(event) {
                let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];

                // Точное определение типа файла
                let fileType = 'image';
                if (file.type.startsWith('video')) {
                    fileType = 'video';
                }

                const newItem = {
                    id: Date.now(),
                    title: title,
                    url: event.target.result,
                    type: fileType,
                    tags: tags,
                    likes: 0,
                    comments: []
                };

                uploads.push(newItem);
                localStorage.setItem('pornUploads', JSON.stringify(uploads));

                alert("✅ Контент успешно загружен!");
                window.location.href = "index.html";
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
