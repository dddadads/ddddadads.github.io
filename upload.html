<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка — PornTube</title>
    <link rel="stylesheet" href="style.css">
    <style>
        main { max-width: 700px; margin: 40px auto; padding: 20px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; background: #333; color: white; border: none; }
        button { width: 100%; padding: 15px; font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <main>
        <h1>Загрузить контент (18+)</h1>
        
        <form id="uploadForm">
            <input type="text" id="title" placeholder="Название видео или фото" required>
            <input type="file" id="fileInput" accept="image/*,video/*" required>
            <input type="text" id="tags" placeholder="Теги через запятую (hentai, rule34, blonde, furry...)">
            <button type="submit">Загрузить на PornTube</button>
        </form>

        <p style="margin-top:20px; color:#888; text-align:center;">
            ⚠️ Файлы сохраняются только в твоём браузере<br>
            Другие пользователи их не увидят
        </p>
    </main>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const file = document.getElementById('fileInput').files[0];
            const title = document.getElementById('title').value.trim();
            const tagsStr = document.getElementById('tags').value;

            if (!file || !title) {
                alert("Название и файл обязательны!");
                return;
            }

            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];

            const reader = new FileReader();
            reader.onload = function(event) {
                let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];

                const newItem = {
                    id: Date.now(),
                    title: title,
                    url: event.target.result,
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    tags: tags,
                    likes: 0,
                    comments: []
                };

                uploads.push(newItem);
                localStorage.setItem('pornUploads', JSON.stringify(uploads));

                alert("✅ Успешно загружено!");
                window.location.href = "index.html";
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
