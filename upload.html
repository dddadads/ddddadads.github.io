<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка — PornTube</title>
    <link rel="stylesheet" href="style.css">
    <style>
        main {
            max-width: 740px;
            margin: 40px auto;
            padding: 45px 35px;
            background: #1a1a1a;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }
        h1 {
            text-align: center;
            margin-bottom: 35px;
            color: #ff4081;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #ddd;
            font-weight: 600;
            font-size: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 18px;
            background: #2a2a2a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
        }
        input[type="file"] {
            display: none;
        }
        .drag-area {
            border: 3px dashed #ff4081;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #222;
        }
        .drag-area:hover,
        .drag-area.dragover {
            background: #2a2a2a;
            border-color: #ff1a5c;
            transform: scale(1.02);
        }
        .drag-area p {
            margin: 10px 0 5px;
            font-size: 17px;
        }
        .drag-area small {
            color: #888;
        }
        button {
            width: 100%;
            padding: 18px;
            margin-top: 15px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #ff1a5c;
            transform: translateY(-3px);
        }
        .info-text {
            text-align: center;
            color: #888;
            margin-top: 30px;
            font-size: 14.5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">PornTube</div>
        <a href="index.html" style="color:white; margin-left:auto;">← На главную</a>
    </header>

    <main>
        <h1>📤 Загрузить контент (18+)</h1>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="title">Название контента</label>
                <input type="text" id="title" placeholder="Введите красивое название" required>
            </div>

            <div class="form-group">
                <label>Файл (фото или видео)</label>
                <div id="drag-area" class="drag-area">
                    <p>Нажмите сюда или перетащите файл</p>
                    <small>Поддерживаются: JPG, PNG, GIF, MP4, WebM и др.</small>
                    <input type="file" id="fileInput" accept="image/*,video/*" required>
                </div>
            </div>

            <div class="form-group">
                <label for="tags">Теги (через запятую)</label>
                <input type="text" id="tags" placeholder="hentai, rule34, blonde, furry, anime, big tits...">
            </div>

            <button type="submit">Загрузить на PornTube</button>
        </form>

        <p class="info-text">
            ⚠️ Все файлы сохраняются только в твоём браузере<br>
            Другие пользователи их не увидят
        </p>
    </main>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const dragArea = document.getElementById('drag-area');

        // Drag & Drop улучшенный
        dragArea.addEventListener('click', () => fileInput.click());

        dragArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragArea.classList.add('dragover');
        });

        dragArea.addEventListener('dragleave', () => {
            dragArea.classList.remove('dragover');
        });

        dragArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dragArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) fileInput.files = e.dataTransfer.files;
        });

        // Основная логика загрузки
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const file = fileInput.files[0];
            const title = document.getElementById('title').value.trim();
            const tagsStr = document.getElementById('tags').value;

            if (!file || !title) {
                alert("Название и файл обязательны!");
                return;
            }

            const tags = tagsStr 
                ? tagsStr.split(',').map(t => t.trim()).filter(t => t.length > 0) 
                : [];

            const reader = new FileReader();
            reader.onload = function(event) {
                let uploads = JSON.parse(localStorage.getItem('pornUploads')) || [];
                const currentUser = localStorage.getItem('currentUser') || "Гость";

                const newItem = {
                    id: Date.now(),
                    title: title,
                    url: event.target.result,
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    tags: tags,
                    likes: 0,
                    comments: [],
                    uploadedBy: currentUser,
                    date: new Date().toISOString()
                };

                uploads.push(newItem);
                localStorage.setItem('pornUploads', JSON.stringify(uploads));

                alert("✅ Контент успешно загружен!");
                window.location.href = "index.html";
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
